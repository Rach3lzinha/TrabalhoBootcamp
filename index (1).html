<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas — Explorador de Países</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <span class="mark">ATLAS</span>
    <span class="mark-sub">explorador de países</span>
  </header>

  <main>
    <section class="hero">
      <h1>Para onde vamos hoje?</h1>
      <p class="lede">Digite o nome de um país — em português ou inglês — e veja capital, população, região, idiomas e moeda na hora.</p>

      <form id="form-busca" class="search" autocomplete="off">
        <label for="campo-busca" class="sr-only">Nome do país</label>
        <input
          type="text"
          id="campo-busca"
          name="pais"
          placeholder="ex.: Brasil, Japan, Kenya..."
          required
        />
        <button type="submit" id="botao-buscar">Buscar</button>
      </form>

      <div class="chips" id="sugestoes">
        <button type="button" class="chip" data-pais="Brazil">Brasil</button>
        <button type="button" class="chip" data-pais="Portugal">Portugal</button>
        <button type="button" class="chip" data-pais="Japan">Japão</button>
        <button type="button" class="chip" data-pais="Kenya">Quênia</button>
        <button type="button" class="chip" data-pais="Norway">Noruega</button>
      </div>
    </section>

    <section class="resultado-wrap">
      <div id="resultado" aria-live="polite">
        <p class="placeholder">Nenhuma busca ainda. Escolha um país acima ou digite um nome para começar.</p>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <p>Dados fornecidos pela <a href="https://restcountries.com/" target="_blank" rel="noopener">REST Countries API</a>.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
